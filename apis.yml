aid: zendit
name: Zendit
description: >-
  Zendit is a cloud-based Prepay-as-a-Service platform that provides API access to a global prepaid ecosystem. The API
  enables businesses to offer mobile top-ups, data packages, digital gift cards, prepaid utility bill payments, and eSIM
  products through a single integration.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
